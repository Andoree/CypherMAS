[project]
name = "codebooks"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "python-dotenv>=1.2.2",
    "langchain-deepseek>=1.1.0",
    "langchain_core>=1.2.23",
    "langgraph>=1.1.3",
    "numpy>=2.2.6",
    "scipy>=1.17.1",
    "pyyaml>=6.0",
    "networkx>=3.6.1",
    "matplotlib>=3.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codebooks"]
